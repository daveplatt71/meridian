name: CI

on:
  push:
  pull_request:

jobs:
  arch-build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake ninja qt6-base qt6-declarative qt6-wayland noto-fonts

      - name: Validate optional layer-shell protocol generation
        run: |
          pacman -S --noconfirm --needed wayland wayland-protocols
          cmake -S . -B build-layer-shell -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOMARIDIAN_WITH_LAYER_SHELL=ON
          cmake --build build-layer-shell
          ctest --test-dir build-layer-shell --output-on-failure

      - name: Build, test, and package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -s /bin/bash -c \
            'cd "$GITHUB_WORKSPACE/packaging" && makepkg --noconfirm --cleanbuild --clean -f'

      - name: Install package and run smoke test
        run: |
          pacman -U --noconfirm packaging/omaridian-0.1.1-1-x86_64.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen QT_QPA_PLATFORMTHEME=basic \
            QT_QUICK_BACKEND=software \
            /usr/bin/omaridian --size 640x360 \
            --at 2026-06-21T08:24:00Z --snapshot /tmp/omaridian-ci.png
          test -s /tmp/omaridian-ci.png

      - name: Validate package metadata and contents
        run: |
          package_file=packaging/omaridian-0.1.1-1-x86_64.pkg.tar.zst
          test -f "$package_file"
          pacman -Qp "$package_file"
          tar -tf "$package_file" | grep -Fx 'usr/bin/omaridian'
          tar -tf "$package_file" | grep -Fx 'usr/share/licenses/omaridian/LICENSE'
          tar -tf "$package_file" | grep -Fx 'usr/share/doc/omaridian/README.md'
